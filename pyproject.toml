[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "packetsleuth-mcp"
version = "0.1.0"
description = "Local-first, read-only PCAP investigation tools over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
packetsleuth-mcp = "packetsleuth.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/packetsleuth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
